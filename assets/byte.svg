<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="byte the cat is hungry. staring at the bowl.">
  <defs>
    
    <radialGradient id="glow" cx="0.3" cy="0.55" r="0.75">
      <stop offset="0" stop-color="#7a4a26"/>
      <stop offset="0.45" stop-color="#3d2416"/>
      <stop offset="1" stop-color="#160d08"/>
    </radialGradient>
    <radialGradient id="candle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/>
      <stop offset="0.4" stop-color="#ff9a3c" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ffc07a"/>
      <stop offset="0.45" stop-color="#e89a52"/>
      <stop offset="1" stop-color="#b8612c"/>
