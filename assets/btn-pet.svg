<svg xmlns="http://www.w3.org/2000/svg" width="166" height="52" viewBox="0 0 166 52" role="img" aria-label="Pet Byte">
  <style>
    @keyframes hop { 0%,70%,100% { transform: translateY(0) rotate(0) } 80% { transform: translateY(-5px) rotate(-10deg) } 90% { transform: translateY(0) rotate(8deg) } }
    .e { transform-box: fill-box; transform-origin: 50% 100%; animation: hop 2.4s ease-in-out infinite; animation-delay: 0.8s; }
  </style>
  <rect x="2" y="6" width="162" height="44" rx="22" fill="#0e2c3d" opacity=".35"/>
  <rect x="2" y="2" width="162" height="44" rx="22" fill="#7ad0ff"/>
  <text class="e" x="18" y="32" font-size="22">🤗</text>
  <text x="50" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0e2c3d">Pet Byte</text>
</svg>
