<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Merhaba, I'm Mehmet. A cozy animated night room with a laptop, a steaming tea glass and a sleepy moon.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-delay: .7s } .s3 { animation-delay: 1.4s } .s4 { animation-delay: 2.1s } .s5 { animation-delay: 1s } .s6 { animation-delay: 2.6s }

    @keyframes wave { 0%,60%,100% { transform: rotate(0) } 10%,30% { transform: rotate(16deg) } 20%,40% { transform: rotate(-8deg) } }
    .hand { transform-box: fill-box; transform-origin: 70% 90%; animation: wave 2.4s ease-in-out infinite; }

    @keyframes phrase { 0% { opacity: 0; transform: translateY(8px) } 3%,22% { opacity: 1; transform: translateY(0) } 25%,100% { opacity: 0; transform: translateY(-8px) } }
    .p { opacity: 0; animation: phrase 12s ease-in-out infinite; }
    .p2 { animation-delay: 3s } .p3 { animation-delay: 6s } .p4 { animation-delay: 9s }

    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .cursor { animation: blink 1s steps(1) infinite; }

    @keyframes steam { 0% { opacity: 0; transform: translateY(6px) scaleX(1) } 30% { opacity: .8 } 100% { opacity: 0; transform: translateY(-26px) scaleX(1.4) } }
    .steam { transform-box: fill-box; transform-origin: center; animation: steam 2.8s ease-out infinite; }
    .st2 { animation-delay: .9s } .st3 { animation-delay: 1.8s }

    @keyframes sway { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
    .leaf { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4s ease-in-out infinite; }
    .l2 { animation-delay: -1.3s } .l3 { animation-delay: -2.6s }

    @keyframes type { 0% { transform: scaleX(0) } 40%,85% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
    .code { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: type 6s steps(10) infinite; }
    .c2 { animation-delay: .5s } .c3 { animation-delay: 1s } .c4 { animation-delay: 1.5s } .c5 { animation-delay: 2s }

    @keyframes glow { 0%,100% { opacity: .55 } 50% { opacity: .8 } }
    .screenglow { animation: glow 3s ease-in-out infinite; }

    @keyframes moonbob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
    .moon { animation: moonbob 5s ease-in-out infinite; }
    @keyframes zz { 0% { opacity: 0; transform: translate(0,0) } 30% { opacity: 1 } 100% { opacity: 0; transform: translate(14px,-22px) } }
    .z { animation: zz 3s ease-out infinite; } .z2 { animation-delay: 1.5s }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2141"/>
      <stop offset="1" stop-color="#16182b"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f6b"/>
      <stop offset="1" stop-color="#7a5aa6"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="win"><rect x="610" y="34" width="190" height="120" rx="14"/></clipPath>
  </defs>

  <!-- card -->
  <rect width="900" height="280" rx="24" fill="url(#bg)"/>
  <circle cx="700" cy="170" r="170" fill="url(#lamp)"/>

  <!-- left: hello -->
  <g class="sans">
    <text x="48" y="92" font-size="40" font-weight="800" fill="#fff4e6">Merhaba, I'm Mehmet</text>
    <g class="hand"><text x="500" y="90" font-size="36">👋</text></g>
  </g>
  <g class="mono" font-size="20" fill="#c9b8ff">
    <text x="50" y="140" fill="#8b7fb8">~/kheif $</text>
    <g transform="translate(172 0)">
      <text class="p p1" x="0" y="140">I write code. ☕</text>
      <text class="p p2" x="0" y="140">I break code. 💥</text>
      <text class="p p3" x="0" y="140">I fix the code I broke. 🩹</text>
      <text class="p p4" x="0" y="140">I run on çay. 🍵</text>
    </g>
  </g>
  <text class="sans" x="50" y="196" font-size="16" fill="#a99dd0">scroll down, there is a cat that needs you 🐾</text>
  <rect class="cursor" x="50" y="208" width="10" height="3" rx="1.5" fill="#ffb86b"/>

  <!-- window -->
  <g clip-path="url(#win)">
    <rect x="610" y="34" width="190" height="120" fill="url(#sky)"/>
    <g fill="#fff">
      <circle class="star s1" cx="630" cy="52" r="1.6"/>
      <circle class="star s2" cx="672" cy="70" r="1.2"/>
      <circle class="star s3" cx="700" cy="46" r="1.8"/>
      <circle class="star s4" cx="650" cy="110" r="1.3"/>
      <circle class="star s5" cx="790" cy="120" r="1.5"/>
      <circle class="star s6" cx="690" cy="128" r="1.1"/>
    </g>
    <g class="moon">
      <circle cx="755" cy="78" r="22" fill="#ffe9a8"/>
      <circle cx="746" cy="72" r="4" fill="#f3d488"/>
      <circle cx="762" cy="88" r="3" fill="#f3d488"/>
      <path d="M743 80 q4 3 8 0" stroke="#7a5aa6" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M757 80 q4 3 8 0" stroke="#7a5aa6" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text class="sans z" x="780" y="62" font-size="12" font-weight="700" fill="#fff4e6">z</text>
      <text class="sans z z2" x="786" y="56" font-size="9" font-weight="700" fill="#fff4e6">z</text>
    </g>
  </g>
  <rect x="610" y="34" width="190" height="120" rx="14" fill="none" stroke="#4a3d73" stroke-width="6"/>
  <line x1="705" y1="34" x2="705" y2="154" stroke="#4a3d73" stroke-width="4"/>

  <!-- desk -->
  <rect x="560" y="226" width="300" height="12" rx="6" fill="#8a5a44"/>
  <rect x="580" y="238" width="10" height="42" fill="#6e4636"/>
  <rect x="830" y="238" width="10" height="42" fill="#6e4636"/>

  <!-- laptop -->
  <rect class="screenglow" x="618" y="164" width="124" height="80" rx="10" fill="#9be7ff" opacity=".6" transform="translate(0 -4)"/>
  <rect x="624" y="158" width="112" height="68" rx="8" fill="#232136"/>
  <g class="mono">
    <rect x="634" y="170" width="46" height="5" rx="2.5" fill="#ff9ec7" class="code c1"/>
    <rect x="644" y="181" width="62" height="5" rx="2.5" fill="#9be7ff" class="code c2"/>
    <rect x="644" y="192" width="38" height="5" rx="2.5" fill="#c3f584" class="code c3"/>
    <rect x="654" y="203" width="54" height="5" rx="2.5" fill="#ffd27a" class="code c4"/>
    <rect x="634" y="214" width="22" height="5" rx="2.5" fill="#ff9ec7" class="code c5"/>
  </g>
  <rect x="606" y="224" width="148" height="6" rx="3" fill="#c7c4dc"/>

  <!-- tea glass (ince belli) -->
  <g>
    <path class="steam st1" d="M782 176 q-6 -8 0 -16 q6 -8 0 -16" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path class="steam st2" d="M792 176 q-6 -8 0 -16 q6 -8 0 -16" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path class="steam st3" d="M802 176 q-6 -8 0 -16 q6 -8 0 -16" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M776 180 h32 q-2 10 -8 18 q6 8 6 22 h-28 q0 -14 6 -22 q-6 -8 -8 -18z" fill="#e8f4ff" fill-opacity=".35" stroke="#e8f4ff" stroke-width="2"/>
    <path d="M779 186 h26 q-2 7 -6 12 q5 8 5 18 h-24 q0 -10 5 -18 q-4 -5 -6 -12z" fill="#c2412d"/>
    <ellipse cx="792" cy="224" rx="22" ry="4" fill="#d9d9e6"/>
  </g>

  <!-- plant -->
  <g>
    <path class="leaf l1" d="M584 176 q-18 -26 -4 -46 q14 20 4 46z" fill="#7bd389"/>
    <path class="leaf l2" d="M588 178 q2 -34 22 -42 q2 26 -22 42z" fill="#5fbf73"/>
    <path class="leaf l3" d="M582 180 q-26 -10 -30 -32 q24 2 30 32z" fill="#93e2a0"/>
    <path d="M568 182 h34 l-5 44 h-24z" fill="#e98a6d"/>
    <rect x="566" y="178" width="38" height="8" rx="4" fill="#d9775c"/>
  </g>
</svg>
