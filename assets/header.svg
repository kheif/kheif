    <text x="56" y="70" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-style="italic" font-size="20" fill="#a88f72">hi, i'm</text>
    <text x="52" y="140" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="76" fill="#ffb35c" opacity=".35" filter="url(#blur)">Mehmet</text>
    <text x="52" y="140" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="76" fill="#f1e3c8">Mehmet</text>
    <text x="56" y="178" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-style="italic" font-size="18" fill="#f1e3c8" opacity=".85">i write software. mostly on purpose.</text>
    <text x="56" y="202" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-style="italic" font-size="18" fill="#a88f72">powered by tea, supervised by a cat.</text>

    
