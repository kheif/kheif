name: Byte the cat

on:
  issues:
    types: [opened]
  schedule:
    - cron: "17 */6 * * *" # time passes, Byte gets hungry
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: byte
  cancel-in-progress: false

jobs:
  care:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'byte|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out what happened
        id: what
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.issue.title }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          if [ "$EVENT" = "issues" ]; then
            action="$(printf '%s' "${TITLE#byte|}" | tr '[:upper:]' '[:lower:]' | tr -dc 'a-z')"
            case "$action" in feed|play|pet) ;; *) action="pet" ;; esac
            echo "action=$action" >> "$GITHUB_OUTPUT"
            echo "user=$LOGIN" >> "$GITHUB_OUTPUT"
          else
            echo "action=tick" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Byte
        env:
          ACTION: ${{ steps.what.outputs.action }}
          USER_LOGIN: ${{ steps.what.outputs.user }}
        run: python pet/byte.py "$ACTION" "$USER_LOGIN"

      - name: Commit
        env:
          ACTION: ${{ steps.what.outputs.action }}
          USER_LOGIN: ${{ steps.what.outputs.user }}
        run: |
          git config user.name "byte-the-cat[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pet/state.json assets/byte.svg README.md
          if git diff --cached --quiet; then exit 0; fi
          if [ "$ACTION" = "tick" ]; then
            msg="🐈 time passes, Byte stretches"
          else
            msg="🐈 @$USER_LOGIN did a $ACTION for Byte"
          fi
          git commit -m "$msg"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            sleep $((i * 3))
          done

      - name: Say thanks and close the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file pet/reply.md
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
